version: '3.8'

services:
  hifi-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hifi-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Optional: Mount token.json as fallback (read-only for security)
      - ./token.json:/app/token.json:ro
      # Optional: Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hifi-network

networks:
  hifi-network:
    driver: bridge
